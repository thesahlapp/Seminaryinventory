# Daily database backup.
#
# Dumps the Supabase database (roles, schema, data, including user accounts),
# encrypts it with BACKUP_PASSPHRASE and stores it as a workflow artifact for
# 90 days. Photos in Storage are not included. See docs/BACKUPS.md.
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Session pooler connection string, with the password filled in
#   BACKUP_PASSPHRASE   A long random passphrase. Keep a copy in your password manager.
name: Database backup

on:
  schedule:
    - cron: "17 8 * * *" # every day, ~3 AM Dallas time
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (see docs/BACKUPS.md)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          # A fixed version: "latest" asks GitHub's API each run and can hit its rate limit.
          version: 2.120.0

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          if ! supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only > dump-error.log 2>&1; then
            cat dump-error.log
            if grep -q "password authentication failed" dump-error.log; then
              echo "::error::The database password in the SUPABASE_DB_URL secret is wrong. Reset it in Supabase (Connect → Reset database password, letters and numbers only), put it into the connection string and update the secret. See docs/BACKUPS.md."
            elif grep -qi "could not translate host name\|Network is unreachable" dump-error.log; then
              echo "::error::Couldn't reach the database. Use the Session pooler connection string (it contains pooler.supabase.com), not Direct connection."
            fi
            exit 1
          fi
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vector_indexes"
          ls -l backup
          # A dump with no stock history is almost certainly wrong.
          grep -q "stock_movements" backup/data.sql

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="inventory-backup-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
